name: yako_theme_switch
description: Custom switch that looks good for changing the theme of the app
version: 2.0.1
repository: https://github.com/yako-dev/flutter-yako-theme-switch
issue_tracker: https://github.com/yako-dev/flutter-yako-theme-switch/issues

topics:
  - ui
  - widget
  - switch
  - theme
  - dark-mode

screenshots:
  - description: "Switch gif animation"
    path: assets/showcase_animation.gif

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Only the icon. The README gif in assets/ must not end up in users' apps.
  assets:
    - assets/dark_mode_switch_icon.svg
